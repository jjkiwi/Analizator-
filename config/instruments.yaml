# Tabela instrumentow XTB -> symbole w darmowych zrodlach danych.
#
# UWAGA 1: lista symboli XTB spisana recznie. Porownaj z xStation i popraw,
#          XTB nie ma API, wiec to jedyne miejsce, gdzie ta lista zyje.
# UWAGA 2: mapowania Yahoo i Binance sprawdzone w sieci 2026-11-10 (`cfd check-sources`, wynik w
#          CLAUDE_CODE/check-sources.txt). Mapowania Stooq NIE sa potwierdzone: Stooq blokowal pobieranie.
#          Kolejnosc wpisow w `sources` = priorytet zrodel (pierwsze dzialajace wygrywa).
#          Rozne zrodla to rozne instrumenty bazowe: Yahoo "=F" to kontrakt futures, Stooq "^..." to indeks kasowy.
# UWAGA 2a: ZINC i NICKEL usuniete decyzja uzytkownika (brak darmowego zrodla; ZNC=F w Yahoo to martwa seria
#          rozliczeniowa bez obrotu).
# UWAGA 3: SWAPY per instrument (pole `costs`) pochodza z tabeli XTB "Tabela stawek punktow swapowych...
#          obowiazujaca od 09.11.2026" (PDF od uzytkownika). Przeliczenie: stawka dzienna w % x 365 / 100,
#          dodatnia = koszt. XTB zmienia te stawki: po nowej tabeli trzeba je wpisac ponownie.
#          AUS200 ma w XTB symbol AU200.cash (stawka wzieta z tego wiersza).
#          SPREADY w `cost_defaults` to nadal ZALOZENIA robocze, nie dane XTB.

cost_defaults:
  indices:     {spread_pct: 0.0003, swap_long_annual_pct: 0.06, swap_short_annual_pct: 0.01}
  commodities: {spread_pct: 0.0010, swap_long_annual_pct: 0.08, swap_short_annual_pct: 0.02}
  metals:      {spread_pct: 0.0005, swap_long_annual_pct: 0.06, swap_short_annual_pct: 0.01}
  crypto:      {spread_pct: 0.0030, swap_long_annual_pct: 0.25, swap_short_annual_pct: 0.10}
  # Akcje trzymane jako prawdziwe akcje (nie CFD): brak swapu, koszt to spread i ewentualne przewalutowanie.
  stocks:      {spread_pct: 0.0030, swap_long_annual_pct: 0.0, swap_short_annual_pct: 0.0}

