# Ustawienia pracy ciaglej (`cfd run`). Sekrety trzymaj w zmiennych srodowiskowych, patrz .env.example.

scan:
  every_minutes: 15
  # 30m: Yahoo daje tylko ~60 dni historii, wiec strategii na 30m nie da sie zwalidowac walk-forward.
  # Sygnaly 30m sa zbierane w dzienniku (forward test), ale traktuj je jako eksperyment.
  intervals: ["1d", "4h", "1h", "30m"]
  # Wszystkie strategie z tej listy trafiaja do dziennika (forward test)...
  strategies: [trend_pullback, donchian_breakout, mean_reversion]
  # ...ale alert dostajesz tylko z tych, ktore przeszly walidacje. Domyslnie zadna.
  alert_strategies: []
  expire_bars: 40

news:
  every_seconds: 60
  alert_min_importance: 2   # 3 = pilne (🔴), 2 = istotne (🟡); oba ida jako powiadomienie
  max_age_hours: 12
  use_llm: true             # lancuch darmowych modeli z config/llm.yaml; bez kluczy dzialaja same reguly

macro:
  refresh_minutes: 60
  alert_minutes_before: 30
  alert_min_importance: 3

fundamentals:
  refresh_hours: 24

health:
  alert_after_failures: 3

quiet_hours:               # w tym czasie powiadomienia sa odkladane i wysylane rano jako jedno podsumowanie
  start: 23
  end: 8
  tz: "Europe/Warsaw"
