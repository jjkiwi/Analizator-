# Specyfikacja kontraktow XTB dla kalkulatora pozycji (`cfd size`) i ekranu "stan na teraz".
#
# Zrodlo: "Specyfikacja instrumentow pochodnych CFD na waluty, indeksy, towary, kryptoaktywa" (PDF XTB od uzytkownika,
# odczyt 2026-11-12). Kolumna "Nominalna wartosc 1 lota" ma postac "Cena instrumentu * WALUTA N": N to mnoznik.
# Wartosci dla klienta detalicznego. XTB zmienia specyfikacje: po nowej tabeli trzeba je zaktualizowac.
#
# lot_multiplier: o ile zmienia sie wynik 1 lota (w walucie instrumentu), gdy cena W XTB zmieni sie o 1.0.
# UWAGA o skali cen: mnoznik odnosi sie do kwotowan XTB. Darmowe zrodla danych moga kwotowac ten sam towar w innej
# jednostce (np. miedz: Yahoo w USD za funt, XTB w USD za tone). Do `cfd size` wpisuj ceny z xStation.
# Spready sa w XTB zmienne i nie ma ich w specyfikacji.

contracts:
  US500:     {lot_multiplier: 50, currency: USD, min_lot: 0.005, lot_step: 0.005}
  US100:     {lot_multiplier: 20, currency: USD, min_lot: 0.003, lot_step: 0.001}
