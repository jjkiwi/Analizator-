topics:
  fed:
    keywords: ["federal reserve", "fed", "fomc", "powell", "rate cut", "rate hike", "interest rates"]
    symbols: [US500, US100, US30, GOLD, SILVER, USDIDX, BITCOIN]
  us_inflation:
    keywords: ["cpi", "us inflation", "pce", "consumer prices", "producer prices"]
    symbols: [US500, US100, GOLD, USDIDX]
  us_jobs:
    keywords: ["payrolls", "nonfarm", "jobless claims", "unemployment rate", "jobs report"]
    symbols: [US500, US100, US30, GOLD, USDIDX]
  ecb:
    keywords: ["ecb", "european central bank", "lagarde", "ezb", "bce", "europejski bank centralny"]
    symbols: [DE40, EU50, FRA40]
  nbp:
    keywords: ["nbp", "rpp", "rada polityki pieniężnej", "stopy procentowe"]
    symbols: [W20]
  oil_supply:
    keywords: ["opec", "opec+", "crude oil", "oil prices", "crude inventories", "strait of hormuz", "ropa", "ölpreis", "pétrole", "petróleo"]
    symbols: [OIL, OIL.WTI, GASOLINE]
  china:
    keywords: ["china stimulus", "pboc", "chinese economy"]
    symbols: [HK.cash, COPPER, OIL]
  crypto_market:
    keywords: ["crypto", "cryptocurrency", "spot etf", "sec crypto", "stablecoin"]
    symbols: [BITCOIN, ETHEREUM, SOLANA]
  uranium:
    keywords: ["uranium", "nuclear power", "uran"]
    symbols: [UEC.US, CEG.US]
  semiconductors:
    keywords: ["semiconductor", "semiconductors", "chip export", "chipmakers", "tsmc", "nvidia"]
    symbols: [ARM.US, MRVL.US, 1YD.DE, US100]
  rare_earths:
    keywords: ["rare earth", "rare earths", "metale ziem rzadkich"]
    symbols: [MP.US]
  geopolitics:
    keywords: ["sanctions", "tariff", "tariffs", "ceasefire", "invasion", "missile"]
    symbols: [US500, OIL, GOLD]

high_impact:
