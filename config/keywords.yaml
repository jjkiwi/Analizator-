# Przypisywanie newsow do instrumentow. Dopasowanie po calych slowach, bez rozrozniania wielkosci liter.
# Wpis z przedrostkiem "cs:" (np. "cs:Fed") wymaga dokladnej pisowni: dla skrotow, ktore jako zwykle
# slowa znacza co innego ("fed up", "eth", "boj").
# `instruments`: slowa wskazujace wprost na instrument (waga co najmniej 2, kierunek z tytulu).
# `exclude`: frazy uniewazniajace dopasowanie wprost danego instrumentu (inne znaczenie slowa).
# `topics`: tematy makro, ktore ruszaja wieloma instrumentami naraz.
# `high_impact`: frazy w TYTULE podnoszace wage newsa do 3 (najwyzsza) w klasyfikatorze regulowym.
# `high_impact_moves`: jak wyzej, ale licza sie tylko razem z dopasowaniem wprost do instrumentu.
# Stan po przegladzie na zywych danych 2026-11-10 (zadanie C2), szczegoly w CLAUDE_CODE/WYNIKI.md.

instruments:
