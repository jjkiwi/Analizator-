# Przypisywanie newsow do instrumentow. Dopasowanie po calych slowach, bez rozrozniania wielkosci liter.
# `instruments`: slowa wskazujace wprost na instrument.
# `topics`: tematy makro, ktore ruszaja wieloma instrumentami naraz.
# `high_impact`: frazy podnoszace wage newsa do 3 (najwyzsza) w klasyfikatorze regulowym.

instruments:
  US500:     ["s&p 500", "s&p500", "sp500", "wall street"]
  US100:     ["nasdaq", "nasdaq 100", "tech stocks"]
  US30:      ["dow jones", "dow industrials"]
