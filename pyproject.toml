[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analizator-cfd"
version = "0.1.0"
description = "Analiza rynku i sygnaly dla CFD (bez skladania zlecen)"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "pyarrow>=15",
  "pyyaml>=6",
  "httpx>=0.27",
  "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
llm = ["anthropic>=1.0"]  # klasyfikator newsow LLM; bez pakietu dzialaja same reguly

[project.scripts]
cfd = "cfd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
