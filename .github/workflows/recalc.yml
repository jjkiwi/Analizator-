# Cotygodniowe przeliczenie walidacji na swiezych danych. Wynik (male pliki JSON w katalogu walidacja/) jest
# commitowany do repozytorium, bo z niego ekran "stan na teraz" bierze liczby pokazywane przy sygnalach.
# To NIE jest uczenie sie strategii: parametry i progi sie nie zmieniaja, odswiezane sa tylko zmierzone statystyki.
# Test kontekstowy (cfd context-test) zapisuje liste potwierdzonych filtrow; dzis jest pusta.
name: przeliczenie
on:
  schedule:
    - cron: "23 3 * * 6"     # sobota rano; harmonogram GitHuba bywa opozniony, tu to bez znaczenia
  workflow_dispatch:
permissions:
  contents: write            # commit katalogu walidacja/
concurrency:
  group: przeliczenie
  cancel-in-progress: false
jobs:
  recalc:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e .
      - name: Przywroc stan roboczy (swiece z lancucha skanow)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: stan-${{ github.run_id }}
          restore-keys: stan-
      - name: Uzupelnij historie
        run: |
          for i in 1d 4h 1h; do cfd fetch --interval $i || true; done
          cfd data-quality --interval 1d --markdown > reports-jakosc.md || true
      - name: Walidacja walk-forward (1d, 4h, 1h)
        run: |
          mkdir -p nowe
          for i in 1d 4h 1h; do cfd report --interval $i --out nowe; done
      - name: Test filtra kontekstowego
        run: cfd context-test --refresh --out nowe
      - name: Zapisz wyniki w repozytorium
        run: |
          rm -rf walidacja && mkdir -p walidacja
          cp nowe/walidacja_1d.json nowe/walidacja_4h.json nowe/walidacja_1h.json nowe/kontekst.md nowe/kontekst_filtry.json walidacja/
          date -u +%F > walidacja/DATA
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add walidacja
          git diff --cached --quiet || git commit -m "Przeliczenie walidacji $(date -u +%F)"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Podsumowanie
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import collections, json, pathlib
          for f in sorted(pathlib.Path("walidacja").glob("walidacja_*.json")):
              rows = [r for r in json.loads(f.read_text()) if "error" not in r]
              print(f"- {f.stem}: {dict(collections.Counter(r['verdict'] for r in rows))}")
          PY
          cat walidacja/kontekst.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: przeliczenie
          path: nowe/
          retention-days: 30
