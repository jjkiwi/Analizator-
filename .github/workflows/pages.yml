# Publikacja ekranu "stan na teraz" jako strony GitHub Pages (adres: https://<uzytkownik>.github.io/<repo>/).
# Wlaczenie (jednorazowo): Settings -> Pages -> Source: "GitHub Actions". Dopoki Pages nie jest wlaczone,
# przebieg sam to wykrywa i konczy sie bez bledu (bez publikacji). Wylaczenie: Settings -> Pages -> Unpublish site.
# Strona jest PUBLICZNA (jak samo repozytorium): pokazuje sygnaly i liste instrumentow, bez kwot i kluczy.
# Uruchamia sie po kazdym udanym skanie i bierze jego artefakt, wiec nie pobiera danych drugi raz.
name: strona
on:
  workflow_run:
    workflows: [skan]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
concurrency:
  group: strona
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Czy Pages jest wlaczone
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" --silent 2>/dev/null; then echo "on=tak" >> "$GITHUB_OUTPUT"
          else echo "on=nie" >> "$GITHUB_OUTPUT"; echo "GitHub Pages nie jest wlaczone: pomijam publikacje." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/download-artifact@v4
        if: steps.pages.outputs.on == 'tak'
        with:
          name: stan-na-teraz
          path: pobrane
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.on == 'tak'
        with:
          path: pobrane/public
      - id: deploy
        if: steps.pages.outputs.on == 'tak'
        uses: actions/deploy-pages@v4
