# Skan co godzine: kalendarz makro, newsy, skan techniczny, dziennik, ekran "stan na teraz".
# Stan roboczy (swiece, dziennik SQLite) wedruje miedzy przebiegami w cache Actions i w artefakcie.
#
# RYTM. Harmonogram GitHuba (`schedule`) okazal sie zawodny: w pierwszej dobie wykonal 3 przebiegi z 48 zaplanowanych.
# Dlatego przebiegi tworza LANCUCH: kazdy po skanie czeka do nastepnej pelnej godziny i sam uruchamia nastepce
# (workflow_dispatch). `schedule` zostaje tylko jako straznik, ktory wznawia lancuch, gdyby sie zerwal.
# Koszt: maszyna GitHuba jest zajeta cala dobe (wiekszosc czasu czeka). W repozytorium publicznym Actions sa bezplatne;
# w prywatnym taki lancuch zuzylby darmowa pule minut w kilka dni. Wylaczenie lancucha: zmienna repozytorium LANCUCH = "nie".
name: skan
on:
  schedule:
    - cron: "47 */6 * * *"   # straznik lancucha
  workflow_dispatch:
    inputs:
      intervals:
        description: "Interwaly (np. '1d 4h') albo 'auto'"
        default: "auto"
permissions:
  contents: write       # eksport dziennika na galaz `dane`
  actions: write        # uruchomienie nastepcy w lancuchu
  pages: write          # publikacja ekranu (GitHub Pages)
  id-token: write
concurrency:              # jeden przebieg naraz; nastepca czeka w kolejce, az poprzednik skonczy
  group: skan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e .
      - name: Przywroc stan roboczy
        uses: actions/cache/restore@v4
        with:
          path: data
          key: stan-${{ github.run_id }}
          restore-keys: stan-
      - name: Pobierz otwarte sygnaly i swieze newsy z Supabase
        if: env.SUPABASE_URL != ''
        run: cfd sync pull
      # Newsy i kalendarz makro zbierane razem ze skanem: kazdy sygnal dostaje w dzienniku kontekst z tej chwili
      # (cfd journal-context ocenia go po rozliczeniu). Bez kluczy modeli newsy klasyfikuja same reguly.
      - name: Makro, newsy, skan
        run: cfd -v run --once --jobs macro news scan --intervals ${{ github.event.inputs.intervals || 'auto' }}
      - name: Ekran "stan na teraz" i podsumowanie dziennika
        if: always()
        run: |
          cfd model predict >/dev/null 2>&1 || true      # prognozy H5 na ekran (dziennik prognoz prowadzi przebieg dzienny)
          git checkout -- walidacja/prognozy_log.csv 2>/dev/null || rm -f walidacja/prognozy_log.csv
          git checkout -- walidacja/zakresy_log.csv 2>/dev/null || rm -f walidacja/zakresy_log.csv
          cfd now --offline --reports walidacja --out public/index.html || true
          { echo '### Dziennik'; echo '```'; cfd journal | head -20; echo '```'; echo '### Kontekst'; cfd journal-context; } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Kopia ekranu i dziennika (artefakt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stan-na-teraz
          path: |
            public/
            data/cfd.sqlite
          retention-days: 14
          overwrite: true
      - name: Ekran jako paczka dla GitHub Pages
        if: always() && hashFiles('public/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Wyslij wyniki do Supabase
        if: env.SUPABASE_URL != '' && always()
        run: cfd sync push
      - name: Zapisz stan roboczy
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: stan-${{ github.run_id }}
      # Dziennik jako CSV na osobnej galezi `dane` (jeden nadpisywany commit, bez historii): do sesji nauki.
      # Ta sama galaz niesie ekran (index.html i pliki PWA), wiec strona dziala przy obu ustawieniach zrodla Pages.
      # Zgoda uzytkownika z 2026-11-16; repozytorium jest publiczne, wiec ten plik tez.
      - name: Eksport dziennika na galaz dane
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cfd journal-export --out eksport || exit 0
          # Ekran tez na tej galezi: dziala, gdy GitHub Pages publikuje z galezi `dane` ("Deploy from a branch").
          if [ -f public/index.html ]; then cp -r public/. eksport/; touch eksport/.nojekyll; fi
          cd eksport
          git init -q -b dane
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Dziennik $(date -u +%FT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dane || true

  # Publikacja ekranu jako instalowalnej aplikacji (PWA) pod adresem https://<uzytkownik>.github.io/<repo>/.
  # Wymaga jednorazowego wlaczenia: Settings -> Pages -> Source: "GitHub Actions". Dopoki nie jest wlaczone, zadanie
  # samo to wykrywa i konczy sie bez bledu. Strona jest publiczna, jak repozytorium.
  strona:
    needs: scan
    if: always() && needs.scan.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Czy Pages jest wlaczone
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          typ=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || echo brak)
          if [ "$typ" = "workflow" ]; then echo "on=tak" >> "$GITHUB_OUTPUT"
          else
            echo "on=nie" >> "$GITHUB_OUTPUT"
            echo "Pomijam publikacje: zrodlo GitHub Pages to '$typ', a musi byc 'GitHub Actions' (Settings -> Pages -> Source)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - id: deploy
        if: steps.pages.outputs.on == 'tak'
        uses: actions/deploy-pages@v4

  # Tor "na zywo" + lancuch. Do konca godziny co ~4 minuty: newsy (RSS) i notowania (swiece 1h) -> live.json na galezi `live`
  # (dashboard doczytuje go sam, bez przebudowy strony). Potem zapis stanu i uruchomienie nastepnego skanu o :02.
  lancuch:
    needs: scan
    if: always() && vars.LANCUCH != 'nie'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e .
      - name: Przywroc stan roboczy
        uses: actions/cache/restore@v4
        with:
          path: data
          key: stan-${{ github.run_id }}-live
          restore-keys: stan-
      - name: Newsy i notowania na zywo do pelnej godziny
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          end=$(( ($(date +%s) / 3600 + 1) * 3600 - 180 ))   # konczymy ok. 3 min przed pelna godzina
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while [ "$(date +%s)" -lt "$end" ]; do
            start=$(date +%s)
            cfd news poll >/dev/null 2>&1 || true
            if cfd live-export --out live; then
              ( cd live && rm -rf .git && git init -q -b live && git add live.json && git commit -qm "Na zywo $(date -u +%H:%MZ)" \
                && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live ) || true
            fi
            left=$(( end - $(date +%s) )); pause=$(( 240 - ($(date +%s) - start) ))
            [ "$left" -le 30 ] && break
            [ "$pause" -gt "$left" ] && pause=$left
            [ "$pause" -gt 0 ] && sleep "$pause"
          done
      - name: Zapisz stan roboczy (z nowymi newsami)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: stan-${{ github.run_id }}-live
      - name: Uruchom nastepny skan o pelnej godzinie
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date +%s); next=$(( (now / 3600 + 1) * 3600 + 120 )); [ $(( next - now )) -gt 3600 ] && next=$(( now + 60 ))
          sleep $(( next - now ))
          gh workflow run scan.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f intervals=auto
