# Skan co godzine: kalendarz makro, newsy, skan techniczny, dziennik, ekran "stan na teraz".
# Stan roboczy (swiece, dziennik SQLite) wedruje miedzy przebiegami w cache Actions i w artefakcie.
#
# RYTM. Harmonogram GitHuba (`schedule`) okazal sie zawodny: w pierwszej dobie wykonal 3 przebiegi z 48 zaplanowanych.
# Dlatego przebiegi tworza LANCUCH: kazdy po skanie czeka do nastepnej pelnej godziny i sam uruchamia nastepce
# (workflow_dispatch). `schedule` zostaje tylko jako straznik, ktory wznawia lancuch, gdyby sie zerwal.
# Koszt: maszyna GitHuba jest zajeta cala dobe (wiekszosc czasu czeka). W repozytorium publicznym Actions sa bezplatne;
# w prywatnym taki lancuch zuzylby darmowa pule minut w kilka dni. Wylaczenie lancucha: zmienna repozytorium LANCUCH = "nie".
name: skan
on:
  schedule:
    - cron: "47 */6 * * *"   # straznik lancucha
  workflow_dispatch:
    inputs:
      intervals:
        description: "Interwaly (np. '1d 4h') albo 'auto'"
        default: "auto"
permissions:
  contents: read
  actions: write        # uruchomienie nastepcy w lancuchu
concurrency:              # jeden przebieg naraz; nastepca czeka w kolejce, az poprzednik skonczy
  group: skan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e .
      - name: Przywroc stan roboczy
        uses: actions/cache/restore@v4
        with:
          path: data
          key: stan-${{ github.run_id }}
          restore-keys: stan-
      - name: Pobierz otwarte sygnaly i swieze newsy z Supabase
        if: env.SUPABASE_URL != ''
        run: cfd sync pull
      # Newsy i kalendarz makro zbierane razem ze skanem: kazdy sygnal dostaje w dzienniku kontekst z tej chwili
      # (cfd journal-context ocenia go po rozliczeniu). Bez kluczy modeli newsy klasyfikuja same reguly.
      - name: Makro, newsy, skan
        run: cfd -v run --once --jobs macro news scan --intervals ${{ github.event.inputs.intervals || 'auto' }}
      - name: Ekran "stan na teraz" i podsumowanie dziennika
        if: always()
        run: |
          cfd now --offline --reports walidacja --out public/index.html || true
          { echo '### Dziennik'; echo '```'; cfd journal | head -20; echo '```'; echo '### Kontekst'; cfd journal-context; } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Kopia ekranu i dziennika (artefakt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stan-na-teraz
          path: |
            public/
            data/cfd.sqlite
          retention-days: 14
          overwrite: true
      - name: Wyslij wyniki do Supabase
        if: env.SUPABASE_URL != '' && always()
        run: cfd sync push
      - name: Zapisz stan roboczy
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: stan-${{ github.run_id }}
      # Ostatni krok: czekaj do 2 minut po nastepnej pelnej godzinie i uruchom nastepny przebieg.
      # Stan jest juz zapisany, wiec przerwanie w trakcie czekania niczego nie traci.
      - name: Lancuch - czekaj do pelnej godziny i uruchom nastepce
        if: always() && vars.LANCUCH != 'nie'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date +%s)
          next=$(( (now / 3600 + 1) * 3600 + 120 ))
          wait=$(( next - now ))
          echo "Nastepny skan za $(( wait / 60 )) min"
          sleep "$wait"
          gh workflow run scan.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f intervals=auto
