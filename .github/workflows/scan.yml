# Tor wolny: skan techniczny po zamknieciu swiecy. Stan roboczy (swiece, dziennik SQLite) wedruje miedzy
# przebiegami w cache Actions; zrodlem prawdy dla sygnalow jest Supabase (pull na starcie, push na koncu).
#
# UWAGA o limitach: przebieg co 30 minut to ok. 1440 uruchomien miesiecznie. W repozytorium PRYWATNYM
# przekroczy to darmowa pule minut; w PUBLICZNYM Actions sa bezplatne. Patrz DECYZJE.md, punkt 17.
# Harmonogram GitHuba bywa opozniony o kilka-kilkanascie minut: dla H1 i wyzej to bez znaczenia, dla M30 juz nie.
name: skan
on:
  schedule:
    - cron: "2,32 * * * *"
  workflow_dispatch:
    inputs:
      intervals:
        description: "Interwaly (np. '1d 4h') albo 'auto'"
        default: "auto"
concurrency:
  group: skan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e .
      - name: Przywroc stan roboczy
        uses: actions/cache/restore@v4
        with:
          path: data
          key: stan-${{ github.run_id }}
          restore-keys: stan-
      - name: Pobierz otwarte sygnaly i swieze newsy z Supabase
        if: env.SUPABASE_URL != ''
        run: cfd sync pull
      # Newsy i kalendarz makro zbierane razem ze skanem: kazdy sygnal dostaje w dzienniku kontekst z tej chwili
      # (cfd journal-context ocenia go po rozliczeniu). Bez kluczy modeli newsy klasyfikuja same reguly.
      - name: Makro, newsy, skan
        run: cfd -v run --once --jobs macro news scan --intervals ${{ github.event.inputs.intervals || 'auto' }}
      - name: Ekran "stan na teraz" i podsumowanie dziennika
        if: always()
        run: |
          cfd now --offline --reports walidacja --out public/index.html || true
          { echo '### Dziennik'; echo '```'; cfd journal | head -20; echo '```'; echo '### Kontekst'; cfd journal-context; } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Kopia ekranu i dziennika (artefakt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stan-na-teraz
          path: |
            public/
            data/cfd.sqlite
          retention-days: 14
          overwrite: true
      - name: Wyslij wyniki do Supabase
        if: env.SUPABASE_URL != '' && always()
        run: cfd sync push
      - name: Zapisz stan roboczy
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: stan-${{ github.run_id }}
