# Uruchomienie:  docker compose -f deploy/docker-compose.yml up -d --build
# Logi:          docker compose -f deploy/docker-compose.yml logs -f --tail 100
# Panel:         reports/panel.html (odswiezany przez `cfd run`, patrz dashboard.refresh_minutes w config/settings.yaml)
services:
  cfd:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: analizator-cfd
    restart: unless-stopped          # automatyczny restart po awarii i po restarcie hosta
    env_file: ../.env                # sekrety tylko tutaj
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data
      - ../reports:/app/reports
    logging:                         # rotacja logow
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    mem_limit: 1g
